<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Manager — Ro'yxatdan o'tish</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #f0f4f8 0%, #e8eef5 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .box {
    background: #fff;
    border-radius: 20px;
    border: 1px solid #e2e8f0;
    padding: 40px 36px;
    width: 400px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.1);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .logo-icon {
    width: 44px; height: 44px;
    background: #1a3c5e;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .logo-text { font-size: 18px; font-weight: 600; color: #1e293b; }
  .logo-sub { font-size: 12px; color: #94a3b8; }
  h2 { font-size: 20px; font-weight: 600; color: #1e293b; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #64748b; margin-bottom: 24px; }
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px; }
  label span { color: #dc2626; }
  input {
    width: 100%; padding: 11px 14px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    font-family: inherit; font-size: 14px; color: #1e293b;
    outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: #1a3c5e; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .msg {
    font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; display: none;
  }
  .msg.error { background: #fee2e2; color: #dc2626; }
  .msg.success { background: #dcfce7; color: #16a34a; }
  button.submit {
    width: 100%; padding: 12px;
    background: #1a3c5e; color: #fff;
    border: none; border-radius: 10px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 6px; transition: background 0.15s;
  }
  button.submit:hover { background: #12293f; }
  button.submit:disabled { opacity: 0.6; cursor: default; }
  .login-link {
    margin-top: 18px; text-align: center; font-size: 13px; color: #64748b;
  }
  .login-link a { color: #1a3c5e; font-weight: 600; text-decoration: none; }
  .login-link a:hover { text-decoration: underline; }
  .divider { border: none; border-top: 1px solid #f1f5f9; margin: 18px 0; }
  .role-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #dbeafe; color: #1d4ed8;
    font-size: 12px; font-weight: 600;
    padding: 5px 12px; border-radius: 20px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-icon">🏨</div>
    <div>
      <div class="logo-text">HotelManager</div>
      <div class="logo-sub">Boshqaruv tizimi</div>
    </div>
  </div>

  <div class="role-badge">👤 Mijoz sifatida ro'yxatdan o'tish</div>

  <h2>Yangi hisob yaratish</h2>
  <p class="sub">Mehmonxonalarni ko'rish va band qilish uchun ro'yxatdan o'ting</p>

  <div class="msg" id="msg"></div>

  <div class="form-group">
    <label>To'liq ism <span>*</span></label>
    <input type="text" id="full_name" placeholder="Sardor Aliyev">
  </div>
  <div class="row">
    <div class="form-group">
      <label>Foydalanuvchi nomi <span>*</span></label>
      <input type="text" id="username" placeholder="sardor99">
    </div>
    <div class="form-group">
      <label>Telefon</label>
      <input type="text" id="phone" placeholder="+998 90 123 45 67">
    </div>
  </div>
  <div class="row">
    <div class="form-group">
      <label>Parol <span>*</span></label>
      <input type="password" id="password" placeholder="••••••">
    </div>
    <div class="form-group">
      <label>Parolni takrorla <span>*</span></label>
      <input type="password" id="password2" placeholder="••••••">
    </div>
  </div>

  <button class="submit" id="reg-btn" onclick="doRegister()">Ro'yxatdan o'tish</button>

  <hr class="divider">

  <div class="login-link">
    Hisobingiz bormi? <a href="/login">Tizimga kiring</a>
  </div>
</div>

<script>
document.addEventListener('keydown', e => { if(e.key==='Enter') doRegister(); });

async function doRegister() {
  const full_name = document.getElementById('full_name').value.trim();
  const username = document.getElementById('username').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value.trim();
  const password2 = document.getElementById('password2').value.trim();
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('reg-btn');

  msgEl.style.display = 'none';

  if (!full_name || !username || !password) {
    showMsg('Majburiy maydonlarni to\'ldiring!', 'error'); return;
  }
  if (password !== password2) {
    showMsg('Parollar mos kelmadi!', 'error'); return;
  }
  if (password.length < 4) {
    showMsg('Parol kamida 4 ta belgidan iborat bo\'lishi kerak!', 'error'); return;
  }

  btn.textContent = 'Yuklanmoqda...';
  btn.disabled = true;

  const res = await fetch('/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ full_name, username, phone, password })
  });
  const data = await res.json();

  if (data.success) {
    showMsg('✅ ' + data.message + ' Kiring sahifasiga yo\'naltirilmoqda...', 'success');
    setTimeout(() => window.location.href = '/login', 1800);
  } else {
    showMsg(data.message, 'error');
    btn.textContent = 'Ro\'yxatdan o\'tish';
    btn.disabled = false;
  }
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}
</script>
</body>
</html>
