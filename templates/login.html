<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Manager — Kirish</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #f0f4f8 0%, #e8eef5 100%);
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .login-box {
    background: #fff; border-radius: 20px; border: 1px solid #e2e8f0;
    padding: 40px 36px; width: 380px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.1);
  }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .logo-icon {
    width: 44px; height: 44px; background: #1a3c5e; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .logo-text { font-size: 18px; font-weight: 600; color: #1e293b; }
  .logo-sub { font-size: 12px; color: #94a3b8; }
  h2 { font-size: 20px; font-weight: 600; color: #1e293b; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #64748b; margin-bottom: 28px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 14px; border: 1px solid #e2e8f0; border-radius: 10px;
    font-family: inherit; font-size: 14px; color: #1e293b; outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: #1a3c5e; }
  .error-msg { background: #fee2e2; color: #dc2626; font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
  button {
    width: 100%; padding: 12px; background: #1a3c5e; color: #fff;
    border: none; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 8px; transition: background 0.15s;
  }
  button:hover { background: #12293f; }
  .hint { margin-top: 18px; text-align: center; font-size: 12px; color: #94a3b8; background: #f8fafc; padding: 10px; border-radius: 8px; }
  .hint span { color: #1a3c5e; font-weight: 600; }
  .divider { border: none; border-top: 1px solid #f1f5f9; margin: 20px 0; }
  .register-link { text-align: center; font-size: 13px; color: #64748b; }
  .register-link a { color: #c9a84c; font-weight: 600; text-decoration: none; }
  .register-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <div class="logo-icon">🏨</div>
    <div>
      <div class="logo-text">HotelManager</div>
      <div class="logo-sub">Boshqaruv tizimi</div>
    </div>
  </div>

  <h2>Tizimga kirish</h2>
  <p class="subtitle">Davom etish uchun login va parolingizni kiriting</p>

  <div class="error-msg" id="error-msg"></div>

  <div class="form-group">
    <label>Foydalanuvchi nomi</label>
    <input type="text" id="username" placeholder="admin" autocomplete="username">
  </div>
  <div class="form-group">
    <label>Parol</label>
    <input type="password" id="password" placeholder="••••••" autocomplete="current-password">
  </div>

  <button onclick="doLogin()" id="login-btn">Kirish</button>

  <div class="hint">
    Admin: <span>admin</span> / <span>1234</span>
  </div>

  <hr class="divider">

  <div class="register-link">
    Yangi foydalanuvchimisiz? <a href="/register">Ro'yxatdan o'ting</a>
  </div>
</div>

<script>
document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const errEl = document.getElementById('error-msg');
  const btn = document.getElementById('login-btn');

  errEl.style.display = 'none';

  if (!username || !password) {
    errEl.textContent = 'Login va parolni kiriting!';
    errEl.style.display = 'block';
    return;
  }

  btn.textContent = 'Kirilmoqda...';
  btn.disabled = true;

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();

  if (data.success) {
    window.location.href = '/';
  } else {
    errEl.textContent = data.message;
    errEl.style.display = 'block';
    btn.textContent = 'Kirish';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
